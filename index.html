<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gigbook">
<title>Gigbook – pamiętnik koncertowy</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0C; --surface:#161618; --surface2:#111113; --line:#2A2A2E; --line2:#1E1E21;
  --text:#F2F2F2; --text2:#D4D4D8; --muted:#A1A1AA; --dim:#71717A;
  --accent:#D7192E; --accent-text:#FF4D5E;
  --head:'Oswald',Impact,'Arial Narrow',sans-serif; --logo:'Pirata One',serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--text2)}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
.top{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top.back{padding:16px 12px 0;justify-content:flex-start}
.logo{font-family:var(--logo);font-size:40px;line-height:1;color:var(--accent);letter-spacing:1px}
h1{margin:0;font-family:var(--head);font-weight:600;font-size:24px;text-transform:uppercase;letter-spacing:1px}
h1.big{font-weight:700;font-size:32px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0}
.iconbtn.plain{border:none;background:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stats{margin:16px 20px 0;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{font-family:var(--head);font-weight:700;font-size:30px;line-height:1}
.lbl{font-size:12px;color:var(--muted);margin-top:2px}
.chips{padding:16px 20px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--text2);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.light.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.sect{font-family:var(--head);font-weight:500;font-size:13px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.list{padding:8px 20px 0;display:flex;flex-direction:column;gap:10px}
.gig{display:flex;gap:14px;align-items:center;padding:12px;text-align:left;width:100%;cursor:pointer}
.datebox{width:52px;height:58px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.datebox b{font-family:var(--head);font-weight:700;font-size:22px;line-height:1}
.datebox span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.gig .t{font-family:var(--head);font-weight:600;font-size:19px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gig .s{font-size:13px;color:var(--muted);margin-top:3px}
.gig .m{font-size:12px;color:var(--text2);margin-top:3px}
.tag{font-size:10px;font-weight:600;letter-spacing:1px;padding:2px 6px;border-radius:4px;border:1px solid #52525B;color:var(--text2);vertical-align:middle;margin-left:6px;font-family:var(--body)}
.tag.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.fab{position:fixed;right:max(20px,calc(50vw - 220px));bottom:calc(96px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.6);cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs div{max-width:480px;margin:0 auto;height:68px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);cursor:pointer;font-size:11px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on span{color:var(--text);font-weight:600}
.btn{height:54px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-family:var(--head);font-weight:600;font-size:18px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.small{height:44px;font-size:15px}
.btn.danger{background:transparent;border:1px solid var(--accent-text);color:var(--accent-text)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.inp{height:50px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:16px;outline:none;width:100%}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:auto;min-height:120px;padding:12px 14px;line-height:1.5;resize:vertical}
.pad{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{height:40px;border:none;border-radius:9px;background:transparent;color:var(--text2);cursor:pointer;font-weight:500}
.seg button.on{background:var(--text);color:var(--bg);font-weight:600}
.res{padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
.res.sel{border-color:var(--accent)}
.res .t{font-family:var(--head);font-weight:600;font-size:17px;text-transform:uppercase}
.radio{width:28px;height:28px;border-radius:14px;border:2px solid #52525B;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.res.sel .radio{background:var(--accent);border-color:var(--accent)}
.note{padding:14px;font-size:14px;line-height:1.5;color:var(--text2)}
.hero{padding:8px 20px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hero .bar{width:48px;height:4px;background:var(--accent)}
.hero h2{margin:0;font-family:var(--head);font-weight:700;font-size:46px;line-height:1.02;text-transform:uppercase;letter-spacing:1px;word-break:break-word}
.rating{display:flex;gap:8px}
.rating button{flex:1;height:28px;border:none;background:transparent;padding:9px 0;cursor:pointer}
.rating button i{display:block;height:10px;border-radius:2px;background:var(--line)}
.rating button.on i{background:var(--accent)}
.song{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center;font-size:15px}
.song .n{width:24px;color:var(--muted);font-family:var(--head);flex-shrink:0}
.song .x{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 20px 0}
.ach{padding:14px;display:flex;flex-direction:column;gap:8px}
.ach.lock{background:var(--surface2)}
.ach.open{border-color:var(--accent)}
.ach .t{font-family:var(--head);font-weight:600;font-size:16px;text-transform:uppercase}
.ach .d{font-size:12px;color:var(--muted);line-height:1.4}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--dim)}
.prog.acc i{background:var(--accent)}
.empty{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{color:var(--muted);margin:0;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.muted{color:var(--muted)} .small{font-size:12px}
.err{color:var(--accent-text);font-size:14px}
.month{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line2)}
.month .row{display:flex;align-items:center;gap:12px}
.month .nm{width:96px;font-family:var(--head);font-weight:500;text-transform:uppercase;letter-spacing:1px;font-size:14px}
.month .track{flex:1;height:10px;background:var(--surface);border-radius:3px;overflow:hidden}
.month .track i{display:block;height:100%;background:var(--accent)}
.month .c{width:24px;text-align:right;font-family:var(--head);font-weight:600}
.month a,.month button.l{font-size:13px;color:var(--text2);padding-left:108px;background:none;border:none;text-align:left;cursor:pointer}
.wbig{font-family:var(--logo);font-size:96px;line-height:.9;color:var(--accent)}
.wnum{font-family:var(--head);font-weight:700;font-size:44px;line-height:1}
.rank{display:flex;align-items:baseline;gap:12px}
.rank .r{font-family:var(--head);font-weight:700;font-size:22px;width:24px;color:var(--text2)}
.rank .a{font-family:var(--head);font-weight:600;font-size:20px;text-transform:uppercase;flex:1}
.rank.first .r{color:var(--accent);font-size:28px}
.rank.first .a{font-size:24px}
.hr{border-top:1px solid var(--line)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ====== Stałe i pomocnicze ====== */
const KEY = 'gigbook.v1';
const MS = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const MG = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MN = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const DN = ['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
const HOME = ['PL','POLSKA','POLAND'];
const DEFAULT_PROXY = 'https://gigbook-proxy.glodek300.workers.dev';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function pl(n, one, few, many){ const a = Math.abs(n); if (a === 1) return one; const d = a % 10, h = a % 100; return (d >= 2 && d <= 4 && (h < 12 || h > 14)) ? few : many; }
const nf = n => n.toLocaleString('pl-PL');
function parts(iso){ const [y, m, d] = (iso || '').split('-').map(Number); return { y, m, d }; }
function jsDate(iso){ const p = parts(iso); return new Date(p.y, p.m - 1, p.d); }
function fmtLong(iso){ const p = parts(iso); return `${DN[jsDate(iso).getDay()]}, ${p.d} ${MG[p.m - 1]} ${p.y}`; }
function fmtShort(iso){ const p = parts(iso); return `${p.d} ${MS[p.m - 1]} ${p.y}`; }
const isAbroad = c => !!c.country && !HOME.includes(String(c.country).trim().toUpperCase());
const songKey = (artist, name) => (artist + '|' + name).toLowerCase().trim();
function today(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

const ICON = {
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  trophy:'<path d="M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M7 6H4a3 3 0 003 4M17 6h3a3 3 0 01-3 4M12 14v4M8 21h8"/>',
  flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-3 2-4 2-7 2 1 3 3 3 3z"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  share:'<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  drop:'<path d="M12 3c-4 4-6 7-6 10a6 6 0 0012 0c0-3-2-6-6-10z"/>',
  star:'<path d="M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17l-5.5 4L8 13.5 3 9l6.5-.5z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  mountain:'<path d="M4 20l4-12 4 6 4-10 4 16z"/>',
  note:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  home:'<path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/>',
  tent:'<path d="M3 20L12 4l9 16H3z"/><path d="M12 4v16M9 20l3-6 3 6"/>',
  map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  skull:'<path d="M12 3a8 8 0 00-8 8c0 3 1.5 4.5 3 5.5V20h10v-3.5c1.5-1 3-2.5 3-5.5a8 8 0 00-8-8z"/><circle cx="9" cy="11" r="1.6"/><circle cx="15" cy="11" r="1.6"/><path d="M10 20v-2M14 20v-2"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5L3 8z"/>'
};
const svg = (name, size = 24, sw = 2) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name] || ''}</svg>`;

/* ====== Dane ====== */
let memCopy = null;
function blank(){ return { version: 1, concerts: [], deleted: [], settings: { proxyUrl: DEFAULT_PROXY }, meta: { dirty: false, lastSync: 0 } }; }
function normalize(d){
  const out = blank();
  if (d && Array.isArray(d.concerts)) out.concerts = d.concerts.filter(c => c && c.artist && c.date).map(c => ({
    id: c.id || uid(), setlistId: c.setlistId || '', artist: String(c.artist), date: String(c.date),
    venue: c.venue || '', city: c.city || '', country: c.country || '', tour: c.tour || '',
    festival: !!c.festival, rating: Math.max(0, Math.min(5, Number(c.rating) || 0)), note: c.note || '',
    songs: Array.isArray(c.songs) ? c.songs.filter(s => s && s.name).map(s => ({ name: String(s.name), encore: !!s.encore })) : [],
    url: c.url || '', source: c.source || 'manual', addedAt: c.addedAt || Date.now(), mod: c.mod || c.addedAt || 0
  }));
  if (d && Array.isArray(d.deleted)) out.deleted = d.deleted.filter(x => x && x.id).map(x => ({ id: String(x.id), at: Number(x.at) || 0 }));
  if (d && d.settings && d.settings.proxyUrl) out.settings.proxyUrl = d.settings.proxyUrl;
  if (d && d.meta) out.meta = { dirty: !!d.meta.dirty, lastSync: Number(d.meta.lastSync) || 0 };
  return out;
}
function load(){ try { const r = localStorage.getItem(KEY); if (r) return normalize(JSON.parse(r)); } catch (e) {} return memCopy || blank(); }
let db = load();
let storageOk = true;
function save(){ memCopy = db; try { localStorage.setItem(KEY, JSON.stringify(db)); storageOk = true; } catch (e) { storageOk = false; } }
/* ====== Konto i synchronizacja ====== */
const AUTH_KEY = 'gigbook.auth';
let authMem = null;
function loadAuth(){ try { const r = localStorage.getItem(AUTH_KEY); if (r) return JSON.parse(r); } catch (e) {} return authMem; }
function saveAuth(){ authMem = auth; try { if (auth) localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); else localStorage.removeItem(AUTH_KEY); } catch (e) {} }
let auth = loadAuth();
let changeSeq = 0, syncT = null, syncing = false, syncErr = '';
const touch = c => { c.mod = Date.now(); };
function changed(){ db.meta.dirty = true; changeSeq++; save(); if (auth) { clearTimeout(syncT); syncT = setTimeout(sync, 3000); } }
function apiBase(){ return (db.settings.proxyUrl || DEFAULT_PROXY).trim().replace(/\/+$/, ''); }
async function api(path, method = 'GET', body){
  const h = { Accept: 'application/json' };
  if (body) h['Content-Type'] = 'application/json';
  if (auth) h.Authorization = 'Bearer ' + auth.token;
  let r;
  try { r = await fetch(apiBase() + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { const err = new Error('Brak połączenia z serwerem.'); err.status = 0; throw err; }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((j && j.error) || ('Błąd serwera (' + r.status + ').')); err.status = r.status; throw err; }
  return j;
}
const sig = d => d.concerts.map(c => c.id + ':' + (c.mod || 0)).sort().join('|') + '#' + (d.deleted || []).length;
function merge(a, b){
  const del = new Map();
  [...(a.deleted || []), ...(b.deleted || [])].forEach(x => { if (!del.has(x.id) || del.get(x.id) < x.at) del.set(x.id, x.at); });
  const m = new Map();
  [...a.concerts, ...b.concerts].forEach(c => { const cur = m.get(c.id); if (!cur || (c.mod || 0) > (cur.mod || 0)) m.set(c.id, c); });
  let concerts = [...m.values()].filter(c => !(del.has(c.id) && del.get(c.id) >= (c.mod || 0)));
  const bySl = new Map();
  concerts.forEach(c => { if (!c.setlistId) return; const cur = bySl.get(c.setlistId); if (!cur || c.id < cur.id) bySl.set(c.setlistId, c); });
  concerts = concerts.filter(c => !c.setlistId || bySl.get(c.setlistId) === c);
  return { concerts, deleted: [...del].map(([id, at]) => ({ id, at })) };
}
async function sync(){
  if (!auth || syncing) return;
  syncing = true; clearTimeout(syncT);
  const seq = changeSeq, before = sig(db);
  try {
    const r = await api('/data');
    const remote = r && r.data ? normalize(r.data) : null;
    const merged = remote ? merge(db, remote) : { concerts: db.concerts, deleted: db.deleted };
    db.concerts = merged.concerts; db.deleted = merged.deleted;
    if (!remote || db.meta.dirty || sig(db) !== sig(remote)) {
      await api('/data', 'PUT', { data: { version: 1, concerts: db.concerts, deleted: db.deleted } });
    }
    if (changeSeq === seq) db.meta.dirty = false; else syncT = setTimeout(sync, 1500);
    db.meta.lastSync = Date.now(); syncErr = ''; save();
  } catch (e) {
    syncErr = e.message;
    if (e.status === 401) { auth = null; saveAuth(); toast('Sesja wygasła – zaloguj się ponownie w Ustawieniach.'); }
  } finally {
    syncing = false;
    const a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
    if (!typing && (sig(db) !== before || ui.view === 'settings')) render();
  }
}

function countBy(list, f){ const m = new Map(); list.forEach(x => { const k = f(x); if (k) m.set(k, (m.get(k) || 0) + 1); }); return m; }
function topOf(m){ let best = null; m.forEach((v, k) => { if (!best || v > best[1]) best = [k, v]; }); return best; }
function distinctSongs(list){ const s = new Set(); list.forEach(c => c.songs.forEach(x => s.add(songKey(c.artist, x.name)))); return s.size; }
function hasBackToBack(){

  for (let i = 1; i < ds.length; i++) if (Math.round((ds[i] - ds[i - 1]) / 864e5) === 1) return 1;
  return 0;
}

/* ====== Wrapped ====== */
function wrapped(y){
  const list = inYear(db.concerts, y);
  const songsTotal = list.reduce((s, c) => s + c.songs.length, 0);
  const artists = countBy(list, c => c.artist.trim());
  const topA = [...artists.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);
  const venue = topOf(countBy(list, c => c.venue.trim()));
  const songs = new Map();
  list.forEach(c => c.songs.forEach(s => { const k = songKey(c.artist, s.name); const e = songs.get(k) || { name: s.name, artist: c.artist, n: 0 }; e.n++; songs.set(k, e); }));
  const topSong = [...songs.values()].sort((a, b) => b.n - a.n)[0];
  const longest = [...list].sort((a, b) => b.songs.length - a.songs.length)[0];
  const month = topOf(countBy(list, c => String(parts(c.date).m)));
  const earlier = new Set(db.concerts.filter(c => parts(c.date).y < y).map(c => c.artist.trim().toLowerCase()));
  const fresh = [...artists.keys()].filter(a => !earlier.has(a.toLowerCase())).length;
  return { list, n: list.length, songsTotal, distinctSongs: songs.size, artists: artists.size, cities: countBy(list, c => c.city.trim().toLowerCase()).size,
    topA, venue, topSong, longest, month, fresh, abroad: list.filter(isAbroad).length };
}

/* ====== setlist.fm (przez pośrednika) ====== */
function mapSetlist(s){
  const [d, m, y] = (s.eventDate || '').split('-');
  const songs = [];
  ((s.sets && s.sets.set) || []).forEach(set => (set.song || []).forEach(so => { if (so.name) songs.push({ name: so.name, encore: set.encore != null }); }));
  return { setlistId: s.id, artist: (s.artist && s.artist.name) || '', date: `${y}-${m}-${d}`,
    venue: (s.venue && s.venue.name) || '', city: (s.venue && s.venue.city && s.venue.city.name) || '',
    country: (s.venue && s.venue.city && s.venue.city.country && s.venue.city.country.code) || '',
    tour: (s.tour && s.tour.name) || '', songs, url: s.url || '' };
}
async function search(page){
  const base = (db.settings.proxyUrl || '').trim().replace(/\/+$/, '');
  if (!base) return;
  const q = ui.sf.q.trim(); if (!q) return;
  Object.assign(ui.sf, { loading: true, error: '', page, searched: true });
  if (page === 1) { ui.sf.results = []; ui.sf.selected = null; }
  render();
  try {
    const params = new URLSearchParams({ artistName: q, p: String(page) });
    if (/^\d{4}$/.test(ui.sf.year.trim())) params.set('year', ui.sf.year.trim());
    const r = await fetch(`${base}/search/setlists?${params}`, { headers: { Accept: 'application/json' } });
    if (r.status === 404) { ui.sf.total = ui.sf.results.length; }
    else if (!r.ok) throw new Error('HTTP ' + r.status);
    else { const j = await r.json(); ui.sf.results = ui.sf.results.concat((j.setlist || []).map(mapSetlist)); ui.sf.total = j.total || 0; }
  } catch (e) {
    ui.sf.error = 'Nie udało się połączyć z setlist.fm. Sprawdź adres pośrednika w ustawieniach i połączenie z internetem.';
  }
  ui.sf.loading = false; render();
}

function go(view, opts = {}){ ui.backTo = ui.view === 'settings' || ui.view === 'add' ? ui.backTo : ui.view; ui.view = view; ui.delArm = false; ui.clearArm = false; Object.assign(ui, opts); render(); window.scrollTo(0, 0); }
let toastT;
function toast(msg){ let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
async function copyText(txt){ try { await navigator.clipboard.writeText(txt); return true; } catch (e) { return false; } }

function songsToText(songs){ const m = songs.filter(s => !s.encore).map(s => s.name), e = songs.filter(s => s.encore).map(s => s.name); return m.join('\n') + (e.length ? '\nBIS\n' + e.join('\n') : ''); }
function textToSongs(t){ let enc = false; const out = []; t.split('\n').map(x => x.trim()).filter(Boolean).forEach(l => { if (/^(bis|encore|--+)\s*:?$/i.test(l)) { enc = true; return; } out.push({ name: l.replace(/^\d+[.)]\s*/, ''), encore: enc }); }); return out; }

function importData(txt){
  let d; try { d = JSON.parse(txt); } catch (e) { toast('To nie jest poprawna kopia Gigbook.'); return; }
  const n = normalize(d); if (!n.concerts.length && !(d && Array.isArray(d.concerts))) { toast('Nie znaleziono koncertów w kopii.'); return; }
  const ids = new Set(db.concerts.map(c => c.id)), sids = new Set(db.concerts.map(c => c.setlistId).filter(Boolean));
  let added = 0; n.concerts.forEach(c => { if (ids.has(c.id) || (c.setlistId && sids.has(c.setlistId))) return; db.concerts.push(c); added++; });
  if (!db.settings.proxyUrl && n.settings.proxyUrl) db.settings.proxyUrl = n.settings.proxyUrl;
  changed(); ui.year = null; render(); toast(`Przywrócono ${added} ${pl(added, 'koncert', 'koncerty', 'koncertów')}.`);
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && auth) sync(); });
if (auth) setTimeout(sync, 300);
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (e) {} }
render();
</script>
