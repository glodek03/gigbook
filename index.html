<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gigbook">
<title>Gigbook – pamiętnik koncertowy</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0C; --surface:#161618; --surface2:#111113; --line:#2A2A2E; --line2:#1E1E21;
  --text:#F2F2F2; --text2:#D4D4D8; --muted:#A1A1AA; --dim:#71717A;
  --accent:#D7192E; --accent-text:#FF4D5E; --on-accent:#FFFFFF;
  --head:'Oswald',Impact,'Arial Narrow',sans-serif; --logo:'Pirata One',serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--text2)}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
.top{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top.back{padding:16px 12px 0;justify-content:flex-start}
.logo{font-family:var(--logo);font-size:40px;line-height:1;color:var(--accent);letter-spacing:1px}
h1{margin:0;font-family:var(--head);font-weight:600;font-size:24px;text-transform:uppercase;letter-spacing:1px}
h1.big{font-weight:700;font-size:32px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0}
.iconbtn.plain{border:none;background:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stats{margin:16px 20px 0;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{font-family:var(--head);font-weight:700;font-size:30px;line-height:1}
.lbl{font-size:12px;color:var(--muted);margin-top:2px}
.chips{padding:16px 20px 4px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--text2);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.light.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.sect{font-family:var(--head);font-weight:500;font-size:13px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.list{padding:8px 20px 0;display:flex;flex-direction:column;gap:10px}
.gig{display:flex;gap:14px;align-items:center;padding:12px;text-align:left;width:100%;cursor:pointer}
.datebox{width:52px;height:58px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.datebox b{font-family:var(--head);font-weight:700;font-size:22px;line-height:1}
.datebox span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.gig .t{font-family:var(--head);font-weight:600;font-size:19px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gig .s{font-size:13px;color:var(--muted);margin-top:3px}
.gig .m{font-size:12px;color:var(--text2);margin-top:3px}
.tag{font-size:10px;font-weight:600;letter-spacing:1px;padding:2px 6px;border-radius:4px;border:1px solid #52525B;color:var(--text2);vertical-align:middle;margin-left:6px;font-family:var(--body)}
.tag.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.fab{position:fixed;right:max(20px,calc(50vw - 220px));bottom:calc(96px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;background:var(--accent);color:var(--on-accent);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.6);cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs div{max-width:480px;margin:0 auto;height:68px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);cursor:pointer;font-size:11px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on span{color:var(--text);font-weight:600}
.btn{height:54px;border-radius:12px;border:none;background:var(--accent);color:var(--on-accent);font-family:var(--head);font-weight:600;font-size:18px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.small{height:44px;font-size:15px}
.btn.danger{background:transparent;border:1px solid var(--accent-text);color:var(--accent-text)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.inp{height:50px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:16px;outline:none;width:100%}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:auto;min-height:120px;padding:12px 14px;line-height:1.5;resize:vertical}
.pad{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{height:40px;border:none;border-radius:9px;background:transparent;color:var(--text2);cursor:pointer;font-weight:500}
.seg button.on{background:var(--text);color:var(--bg);font-weight:600}
.res{padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
.res.sel{border-color:var(--accent)}
.res .t{font-family:var(--head);font-weight:600;font-size:17px;text-transform:uppercase}
.radio{width:28px;height:28px;border-radius:14px;border:2px solid #52525B;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.res.sel .radio{background:var(--accent);border-color:var(--accent)}
.note{padding:14px;font-size:14px;line-height:1.5;color:var(--text2)}
.hero{padding:8px 20px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hero .bar{width:48px;height:4px;background:var(--accent)}
.hero h2{margin:0;font-family:var(--head);font-weight:700;font-size:46px;line-height:1.02;text-transform:uppercase;letter-spacing:1px;word-break:break-word}
.rating{display:flex;gap:8px}
.rating button{flex:1;height:28px;border:none;background:transparent;padding:9px 0;cursor:pointer}
.rating button i{display:block;height:10px;border-radius:2px;background:var(--line)}
.rating button.on i{background:var(--accent)}
.song{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center;font-size:15px}
.song .n{width:24px;color:var(--muted);font-family:var(--head);flex-shrink:0}
.song .x{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 20px 0}
.ach{padding:14px;display:flex;flex-direction:column;gap:8px}
.ach.lock{background:var(--surface2)}
.ach.open{border-color:var(--accent)}
.ach .t{font-family:var(--head);font-weight:600;font-size:16px;text-transform:uppercase}
.ach .d{font-size:12px;color:var(--muted);line-height:1.4}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--dim)}
.prog.acc i{background:var(--accent)}
.empty{padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{color:var(--muted);margin:0;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.muted{color:var(--muted)} .small{font-size:12px}
.err{color:var(--accent-text);font-size:14px}
.month{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line2)}
.month .row{display:flex;align-items:center;gap:12px}
.month .nm{width:96px;font-family:var(--head);font-weight:500;text-transform:uppercase;letter-spacing:1px;font-size:14px}
.month .track{flex:1;height:10px;background:var(--surface);border-radius:3px;overflow:hidden}
.month .track i{display:block;height:100%;background:var(--accent)}
.month .c{width:24px;text-align:right;font-family:var(--head);font-weight:600}
.month a,.month button.l{font-size:13px;color:var(--text2);padding-left:108px;background:none;border:none;text-align:left;cursor:pointer}
.wbig{font-family:var(--logo);font-size:96px;line-height:.9;color:var(--accent)}
.wnum{font-family:var(--head);font-weight:700;font-size:44px;line-height:1}
.rank{display:flex;align-items:baseline;gap:12px}
.rank .r{font-family:var(--head);font-weight:700;font-size:22px;width:24px;color:var(--text2)}
.rank .a{font-family:var(--head);font-weight:600;font-size:20px;text-transform:uppercase;flex:1}
.rank.first .r{color:var(--accent);font-size:28px}
.rank.first .a{font-size:24px}
.hr{border-top:1px solid var(--line)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.songbtn{background:none;border:none;color:inherit;font:inherit;padding:0;text-align:left;cursor:pointer;line-height:1.35}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;border:none;width:100%;cursor:pointer}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:56;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sheet a.btn{text-decoration:none}
.swatch{width:52px;height:52px;border-radius:26px;border:3px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.swatch.on{border-color:var(--text)}
.slides{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;gap:16px;padding:calc(14px + env(safe-area-inset-top)) 24px calc(18px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.sbar{display:flex;gap:4px;position:relative;z-index:3;padding-right:48px}.sbar i{flex:1;height:3px;border-radius:2px;background:#3F3F46}.sbar i.on{background:var(--text)}
.sclose{position:absolute;right:12px;top:calc(2px + env(safe-area-inset-top));z-index:4}
.snav{position:absolute;top:70px;bottom:110px;background:transparent;border:none;z-index:2;cursor:pointer}.snav.prev{left:0;width:35%}.snav.next{right:0;width:65%}
.sbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;z-index:1;min-height:0}
.sfoot{position:relative;z-index:3}
.skick{font-family:var(--head);font-weight:500;font-size:15px;letter-spacing:4px;color:var(--muted);text-transform:uppercase}
.sbig{font-family:var(--head);font-weight:700;line-height:1.02;text-transform:uppercase;word-break:break-word}
.sbig.year{font-family:var(--logo);color:var(--accent);text-transform:none;font-weight:400}
.stitle{font-family:var(--head);font-weight:600;font-size:24px;text-transform:uppercase;line-height:1.15}
.sstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
.ph{aspect-ratio:1;border-radius:8px;background:var(--surface);border:1px solid var(--line);padding:0;overflow:hidden;position:relative;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
.ph .tag{position:absolute;left:6px;bottom:6px;margin:0;background:rgba(11,11,12,.8)}
.phadd{aspect-ratio:1;border-radius:8px;border:1px dashed #52525B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text2);font-size:12px;cursor:pointer}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:60;display:flex;flex-direction:column;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.linkchip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;align-self:flex-start;margin-top:6px}
#map{height:46vh;min-height:280px;margin:16px 20px 0;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#111}
.leaflet-container{background:#111!important;font-family:var(--body)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.95) saturate(.35)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#161618!important;color:#F2F2F2!important}
.leaflet-popup-content{margin:12px 14px!important;font:500 13px var(--body)}
.leaflet-popup-content button.l{display:block;background:none;border:none;color:#F2F2F2;padding:5px 0;text-align:left;cursor:pointer;font:500 13px var(--body);text-decoration:underline;text-decoration-color:#52525B}
.leaflet-control-attribution{background:rgba(11,11,12,.75)!important;color:#A1A1AA!important}.leaflet-control-attribution a{color:#D4D4D8!important}
.leaflet-container a.leaflet-popup-close-button{color:#A1A1AA}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ====== Stałe i pomocnicze ====== */
const KEY = 'gigbook.v1';
const MS = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const MG = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MN = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const DN = ['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
const HOME = ['PL','POLSKA','POLAND'];
const COUNTRIES = [['', 'Wszystkie kraje'], ['PL', 'Polska'], ['CZ', 'Czechy'], ['DE', 'Niemcy'], ['SK', 'Słowacja'], ['AT', 'Austria'], ['HU', 'Węgry'], ['LT', 'Litwa'],
  ['NL', 'Holandia'], ['BE', 'Belgia'], ['FR', 'Francja'], ['GB', 'Wielka Brytania'], ['DK', 'Dania'], ['SE', 'Szwecja'], ['NO', 'Norwegia'], ['FI', 'Finlandia'],
  ['CH', 'Szwajcaria'], ['IT', 'Włochy'], ['ES', 'Hiszpania'], ['PT', 'Portugalia'], ['HR', 'Chorwacja'], ['SI', 'Słowenia'], ['UA', 'Ukraina'], ['US', 'USA'], ['CA', 'Kanada']];
const DEFAULT_PROXY = 'https://gigbook-proxy.glodek300.workers.dev';
const ACCENTS = [
  { id: 'red', name: 'Krwista czerwień', a: '#D7192E', t: '#FF4D5E', on: '#FFFFFF' },
  { id: 'green', name: 'Toksyczna zieleń', a: '#8FD400', t: '#A6E22E', on: '#0B0B0C' },
  { id: 'gold', name: 'Złoto', a: '#E8A317', t: '#F2B43A', on: '#0B0B0C' },
  { id: 'violet', name: 'Fiolet', a: '#6E4BFF', t: '#A08BFF', on: '#FFFFFF' },
  { id: 'ice', name: 'Lodowy błękit', a: '#2F9BFF', t: '#6CB8FF', on: '#0B0B0C' }
];
function applyAccent(){ const x = ACCENTS.find(a => a.id === (db && db.settings.accent)) || ACCENTS[0]; const r = document.documentElement.style;
  r.setProperty('--accent', x.a); r.setProperty('--accent-text', x.t); r.setProperty('--on-accent', x.on); }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function pl(n, one, few, many){ const a = Math.abs(n); if (a === 1) return one; const d = a % 10, h = a % 100; return (d >= 2 && d <= 4 && (h < 12 || h > 14)) ? few : many; }
const nf = n => n.toLocaleString('pl-PL');
function parts(iso){ const [y, m, d] = (iso || '').split('-').map(Number); return { y, m, d }; }
function jsDate(iso){ const p = parts(iso); return new Date(p.y, p.m - 1, p.d); }
function fmtLong(iso){ const p = parts(iso); return `${DN[jsDate(iso).getDay()]}, ${p.d} ${MG[p.m - 1]} ${p.y}`; }
function fmtShort(iso){ const p = parts(iso); return `${p.d} ${MS[p.m - 1]} ${p.y}`; }
const isAbroad = c => !!c.country && !HOME.includes(String(c.country).trim().toUpperCase());
const songKey = (artist, name) => (artist + '|' + name).toLowerCase().trim();
function today(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

const ICON = {
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  trophy:'<path d="M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M7 6H4a3 3 0 003 4M17 6h3a3 3 0 01-3 4M12 14v4M8 21h8"/>',
  flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-3 2-4 2-7 2 1 3 3 3 3z"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  share:'<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  drop:'<path d="M12 3c-4 4-6 7-6 10a6 6 0 0012 0c0-3-2-6-6-10z"/>',
  star:'<path d="M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17l-5.5 4L8 13.5 3 9l6.5-.5z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  mountain:'<path d="M4 20l4-12 4 6 4-10 4 16z"/>',
  note:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  home:'<path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/>',

    if (/^\d{4}-\d{2}-\d{2}$/.test(s.date)) { const [y, m, d] = s.date.split('-'); params.set('date', `${d}-${m}-${y}`); }

  if (page === 1) { s.results = []; s.selected = null; s.total = 0; }
  render();

    const j = await slJson(`/search/setlists?${params}`);
    if (reqId !== s.reqId) return;

    else { s.results = s.results.concat((j.setlist || []).map(mapSetlist)); s.total = j.total || 0; }
  } catch (e) {
    if (reqId !== s.reqId) return;
    s.error = e.status === 429 ? e.message : 'Nie udało się połączyć z setlist.fm. Sprawdź internet i spróbuj ponownie.';
  }

}

const rareBusy = new Set();
async function checkRarity(c){
  if (!c || !c.mbid || !c.songs.length || rareBusy.has(c.id)) return;
  rareBusy.add(c.id); if (ui.view === 'detail') render();
  try {
    const q = new URLSearchParams({ artistMbid: c.mbid });
    if (c.tour) q.set('tourName', c.tour); else q.set('year', String(parts(c.date).y));
    const shows = [];
    for (let p = 1; p <= 3; p++) {
      q.set('p', String(p));
      const j = await slJson('/search/setlists?' + q);
      if (!j || !j.setlist) break;
      j.setlist.forEach(x => { const m = mapSetlist(x); if (m.songs.length && m.date <= today()) shows.push(new Set(m.songs.map(t => t.name.toLowerCase().trim()))); });
      if (p * (j.itemsPerPage || 20) >= (j.total || 0)) break;
    }
    const songs = {};
    c.songs.forEach(t => { const k = t.name.toLowerCase().trim(); songs[t.name] = shows.filter(set => set.has(k)).length; });
    c.rare = { shows: shows.length, scope: c.tour ? 'tour' : 'year', songs, at: Date.now() };
    touch(c); changed();
  } catch (e) { toast(e.status === 429 ? e.message : 'Nie udało się sprawdzić rzadkości utworów.'); }
  rareBusy.delete(c.id);
  if (!isTyping()) render();
}
function rarityOf(c, name){
  if (!c.rare || c.rare.shows < 5) return null;
  const n = c.rare.songs[name]; if (n == null) return null;
  const r = n / c.rare.shows;
  if (n <= 1 || r <= 0.05) return { kind: 'kruk', n: Math.max(1, n) };
  if (r <= 0.25) return { kind: 'rare', n };
  return null;
}
function isTyping(){ const a = document.activeElement; return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')); }

const bandRecent = {};
async function loadBandRecent(mbid){
  if (!mbid || bandRecent[mbid]) return;

    const j = await slJson('/artist/' + encodeURIComponent(mbid) + '/setlists?p=1');
    const list = ((j && j.setlist) || []).map(mapSetlist).filter(m => m.songs.length && m.date <= today());
    const cnt = new Map();
    list.forEach(m => new Set(m.songs.map(t => t.name)).forEach(n => cnt.set(n, (cnt.get(n) || 0) + 1)));
    bandRecent[mbid] = { shows: list.length, songs: [...cnt].map(([name, n]) => ({ name, n })).sort((a, b) => b.n - a.n) };
  } catch (e) { bandRecent[mbid] = { err: e.status === 429 ? e.message : 'Nie udało się pobrać ostatnich koncertów zespołu.' }; }

function kmBetween(a, b){ const R = 6371, t = x => x * Math.PI / 180; const dLat = t(b.lat - a.lat), dLng = t(b.lng - a.lng);

    countries: countBy(list, c => (c.country || '').toUpperCase()).size, cities: countBy(list, c => c.city.trim().toLowerCase()).size };
}

function compressImage(file, max = 1600){

    img.onload = () => {

      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);

}

async function searchFest(){
  const s = ui.sf;
  if (!s.fCity.trim() || !/^\d{4}-\d{2}-\d{2}$/.test(s.fStart)) { s.fErr = 'Podaj miasto i pierwszy dzień festiwalu.'; render(); return; }
  Object.assign(s, { fLoading: true, fErr: '', fRes: [], fPick: new Set(), fDone: false }); render();
  try {
    const out = [];
    for (let k = 0; k < s.fDays; k++) {
      const d = jsDate(s.fStart); d.setDate(d.getDate() + k);
      const q = new URLSearchParams({ cityName: s.fCity.trim(), date: `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}` });
      for (let p = 1; p <= 3; p++) {
        q.set('p', String(p));
        const j = await slJson('/search/setlists?' + q);
        if (!j || !j.setlist) break;
        out.push(...j.setlist.map(mapSetlist));
        if (p * (j.itemsPerPage || 20) >= (j.total || 0)) break;
      }
    }
    s.fRes = [...new Map(out.map(r => [r.setlistId, r])).values()];
  } catch (e) { s.fErr = e.status === 429 ? e.message : 'Nie udało się połączyć z setlist.fm.'; }
  s.fLoading = false; s.fDone = true; render();
}

  pick: v => { ui.sf.selected = Number(v); render(); },
  more: () => search(ui.sf.page + 1),

    if (c.mbid && c.songs.length) checkRarity(c); },
  share: async () => { const w = wrapped(ui.wYear);
    const txt = `Mój rok pod sceną ${ui.wYear}: ${w.n} ${pl(w.n, 'koncert', 'koncerty', 'koncertów')}, ${w.songsTotal} ${pl(w.songsTotal, 'utwór', 'utwory', 'utworów')} na żywo, ${w.artists} ${pl(w.artists, 'zespół', 'zespoły', 'zespołów')}.` + (w.topA[0] ? ` Numer 1: ${w.topA[0][0]} (${w.topA[0][1]}×).` : '') + ' #Gigbook';

  copyjson: async () => toast(await copyText(JSON.stringify(db)) ? 'Kopia w schowku – wklej ją np. do notatki.' : 'Nie udało się skopiować.'),

};

app.addEventListener('submit', e => {
